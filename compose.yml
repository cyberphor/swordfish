services:

  backend:
    profiles: [ all, backend ]
    build: backend
    image: swordfish/backend:latest
    container_name: swordfish-backend
    ports:
      - "8181:8181"
    env_file:
      - backend/.env
    depends_on:
      database:
        condition: service_healthy

  docs:
    profiles: [ docs ]
    build: docs
    image: swordfish/docs:latest
    container_name: swordfish-docs
    ports:
      - "5050:5050"

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: swordfish/frontend:latest
    container_name: swordfish-frontend
    ports:
      - "80:8501"
    env_file:
      - frontend/.env

  inference:
    profiles: [ all, inference ]
    build: inference
    image: swordfish/tools:latest
    container_name: swordfish-inference

  tools:
    profiles: [ all, tools ]
    build: tools
    image: swordfish/tools:latest
    container_name: swordfish-tools
    ports:
      - "8282:8282"
    env_file:
      - tools/.env

  database:
    profiles: [ all, database ]
    build: database
    image: swordfish/database:latest
    container_name: swordfish-database
    ports:
      - "5432:5432"
    volumes:
      - swordfish_database:/var/lib/postgresql/data
    env_file:
      - database/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

volumes:
  swordfish_database:
