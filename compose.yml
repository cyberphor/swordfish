services:
  llama-server:
    profiles: [ all, llama-server ]
    build: llama-server
    image: ${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/llama-server:${LLAMA_SERVER_VERSION}
    container_name: ${APP_NAME}-llama-server
    ports:
      - "8080:8080"
    env_file:
      - .env.local

  mcp-server:
    profiles: [ all, mcp-server ]
    build: mcp-server
    image: ${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/mcp-server:${MCP_SERVER_VERSION}
    container_name: ${APP_NAME}-mcp-server
    ports:
      - "8000:8000"
    env_file:
      - .env.local

  backend:
    profiles: [ backend ]
    build: backend
    image: ${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/backend:${BACKEND_VERSION}
    container_name: ${APP_NAME}-backend
    ports:
      - "8001:8001"
    env_file:
      - .env.local

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: ${CONTAINER_REGISTRY}/${CI_PROJECT_PATH}/frontend:${FRONTEND_VERSION}
    container_name: ${APP_NAME}-frontend
    ports:
      - "80:8000"
    env_file:
      - .env.local
