services:

  backend:
    profiles: [ all, backend ]
    build: backend
    image: swordfish/backend:latest
    container_name: swordfish-backend
    ports:
      - "8181:8181"
    env_file:
      - backend/.env

  fastmcp:
    profiles: [ all, fastmcp ]
    build: fastmcp
    image: swordfish/fastmcp:latest
    container_name: swordfish-fastmcp
    ports:
      - "8282:8282"
    env_file:
      - fastmcp/.env
    volumes:
      - /usr/local/share/ca-certificates/Certificates_PKCS7_v5_14_DoD.der.crt:/usr/local/share/ca-certificates/Certificates_PKCS7_v5_14_DoD.der.crt

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: swordfish/frontend:latest
    container_name: swordfish-frontend
    ports:
      - "80:8501"
    env_file:
      - frontend/.env

  postgres:
    profiles: [ all, postgres ]
    build: postgres
    image: swordfish/postgres:latest
    container_name: swordfish-postgres
    ports:
      - "5432:5432"
    volumes:
      - swordfish_postgres:/var/lib/postgresql/data
    env_file:
      - postgres/.env

  docs:
    profiles: [ docs ]
    build: docs
    image: swordfish/docs:latest
    container_name: swordfish-docs
    ports:
      - "5050:5050"

volumes:
  swordfish_postgres:
