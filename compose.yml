services:

  docs:
    profiles: [ all, docs ]
    build: docs
    image: swordfish/docs:latest
    container_name: swordfish-docs
    ports:
      - "5050:5050"
    env_file:
      - .env

  emass:
    profiles: [ all, emass ]
    build: emass
    image: swordfish/emass:latest
    container_name: swordfish-emass
    ports:
      - "4010:4010"
    env_file:
      - .env

  tools:
    profiles: [ all, tools ]
    build: tools
    image: swordfish/tools:latest
    container_name: swordfish-tools
    ports:
      - "8282:8282"
    env_file:
      - .env

  agent:
    profiles: [ all, agent ]
    build: agent/openai_gpt-4o
    image: swordfish/agent:latest
    container_name: swordfish-agent
    ports:
      - "8181:8181"
    env_file:
      - .env

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: swordfish/frontend:latest
    container_name: swordfish-frontend
    ports:
      - "80:8501"
    env_file:
      - .env
