services:

  docs:
    profiles: [ docs ]
    build: docs
    image: swordfish/docs:latest
    container_name: swordfish-docs
    ports:
      - "5050:5050"

  emass:
    profiles: [ emass ]
    build: emass
    image: swordfish/emass:latest
    container_name: swordfish-emass
    ports:
      - "4010:4010"
 
  tools:
    profiles: [ all, tools ]
    build: tools
    image: swordfish/tools:latest
    container_name: swordfish-tools
    ports:
      - "8282:8282"
    env_file:
      - tools/.env
    volumes:
      - /usr/local/share/ca-certificates/Certificates_PKCS7_v5_14_DoD.der.crt:/usr/local/share/ca-certificates/Certificates_PKCS7_v5_14_DoD.der.crt
    extra_hosts:
      - "connect.emass.apps.mil:156.112.171.12"

  agent:
    profiles: [ all, agent ]
    build: agent/aoai_gpt-4o
    image: swordfish/agent:latest
    container_name: swordfish-agent
    ports:
      - "8181:8181"
    env_file:
      - agent/aoai_gpt-4o/.env

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: swordfish/frontend:latest
    container_name: swordfish-frontend
    ports:
      - "80:8501"
    env_file:
      - frontend/.env
