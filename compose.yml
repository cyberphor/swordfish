services:

  backend:
    profiles: [ all, backend, database ]
    build: backend
    image: swordfish/backend:latest
    container_name: swordfish-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/healthcheck/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  database:
    profiles: [ all, backend, database ]
    build: database
    image: swordfish/database:latest
    container_name: swordfish-database
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - database/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  docs:
    profiles: [ docs ]
    build: docs
    image: swordfish/docs:latest
    container_name: swordfish-docs
    ports:
      - "5050:5050"

  frontend:
    profiles: [ all, frontend ]
    build: frontend
    image: swordfish/frontend:latest
    container_name: swordfish-frontend
    ports:
      - "80:8501"
    env_file:
      - frontend/.env

  inference:
    profiles: [ all, inference ]
    build: inference
    image: swordfish/inference:latest
    container_name: swordfish-inference
    ports:
      - "8001:8001"
    env_file:
      - inference/.env
    depends_on:
      backend:
        condition: service_healthy
      tools:
        condition: service_healthy

  tools:
    profiles: [ all, tools ]
    build: tools
    image: swordfish/tools:latest
    container_name: swordfish-tools
    ports:
      - "8002:8002"
    env_file:
      - tools/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/api/v1/healthcheck > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

volumes:
  database:
