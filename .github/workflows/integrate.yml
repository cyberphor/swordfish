---
name: Integrate

on:
  push:
    branches: [ "**" ]

jobs:
  enumerate:
    name: Enumerate
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.parse.outputs.containers }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Parse compose.yml
        id: parse
        run: |
          containers=$(yq '[.services.[] | .build] | unique | map(select(. != null))' compose.yml -o json | jq -c .)
          echo "containers=$containers" >> $GITHUB_OUTPUT

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Run Trufflehog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: false

  qa:
    name: QA: ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ${{ fromJson(needs.enumerate.outputs.containers) }}
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Python dependencies
        run: python -m pip install black
      - name: Check code formatting
        run: black --diff --color --check ${{ matrix.container }}

  sca:
    name: SCA: ${{ matrix.container }}
    needs: enumerate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      matrix:
        container: ${{ fromJson(needs.enumerate.outputs.containers) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.container }}
          output-file: sbom-${{ matrix.container }}.json
      - name: Check for CVEs
        uses: anchore/scan-action@v3
        with:
          sbom: sbom-${{ matrix.container }}.json
          severity-cutoff: high

  sast:
    name: SAST: ${{ matrix.container }}
    needs: enumerate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ${{ fromJson(needs.enumerate.outputs.containers) }}
      fail-fast: false
    container:
      image: semgrep/semgrep
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Perform a SAST scan
        run: semgrep scan --config auto ${{ matrix.container }}
