{% extends "base.html" %}

{% block content %}
<div class="sf-search-page">
  <h1>Search</h1>
  <form action="{{ 'search.html'|url }}" method="get" role="search">
    <input type="search" name="q" placeholder="Type to search…" aria-label="Search query" autofocus>
  </form>
  <div id="mkdocs-search-results" style="margin-top: 2rem;">
    <p style="font-family: var(--mono); font-size: 0.78rem; color: var(--muted);">Enter a query above.</p>
  </div>
</div>
{% endblock %}
